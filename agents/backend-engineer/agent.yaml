id: backend-engineer
version: 1
role: backend_engineer
engine: claude-code
model_alias: agent-default
prompt_file: prompt.md
tools:
  platform:
    - ask_human
    - check_answers
    - declare_assumption
    - search_standing_decisions
    - request_checkpoint
    - report_progress
    - register_artifact
  engine_builtin: [read, edit, write, bash, grep, glob]
  denied: [web_fetch]
limits:
  max_turns: 60
  max_wall_seconds: 1800
  budget_usd: 2.00
asks: [peer_engineer]
